global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "punishment-service"
    dns_sd_configs:
      - names:
          - "punishment-service"
        type: A
        port: 8080
    metrics_path: /metrics

  - job_name: "envoy"
    static_configs:
      - targets: ["envoy:9901"]
    metrics_path: /stats/prometheus
