name: Checkstyle via Detekt

on:
  push:
    branches: [ main, master ]

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Validate Gradle Wrapper
        run: ./gradlew --version
      - name: Detekt
        run: ./gradlew detekt
